<!doctype html><html lang="lo"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Judo Academy</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Judo Academy">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;min-height:100%;background:#000;color:#fff;font:16px/1.4 system-ui,-apple-system,"Noto Sans Lao",sans-serif}
#shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#shell img{width:96px;height:96px;border-radius:20px}
#shell input{font-size:18px;padding:10px 14px;border-radius:10px;border:1px solid #666;background:#111;color:#fff;text-align:center;width:220px}
#shell button{font-size:16px;padding:10px 22px;border-radius:10px;border:0;background:#fff;color:#000;font-weight:700}
#msg{min-height:22px;color:#ccc;font-size:14px}
</style></head>
<body>
<div id="shell">
<img src="icon-192.png" alt="">
<div style="font-size:20px;font-weight:700">Judo Academy</div>
<div id="login" style="display:none;flex-direction:column;gap:10px;align-items:center">
<input id="code" type="password" placeholder="ລະຫັດເຂົ້າໃຊ້" autocomplete="off">
<button id="go">ເຂົ້າ</button>
</div>
<div id="msg"></div>
</div>
<script>
(function(){
var API="https://script.google.com/macros/s/AKfycby8SiHXc49S4toie1q-6jpW2RNNM9kBVPzLo1KXq-GyUz_-4jZ4mHcn_cR-C_JGBUwVFA/exec";
var LS=window.localStorage;
function K(){return LS.getItem("ljfk")||"";}
var inf={},cch={},q=[],act=0;
function pump(){while(act<3&&q.length){(function(j){act++;raw(j.fn,j.args).then(function(v){if(v&&v.ok&&j.fn!=="getPage")cch[j.key]={t:Date.now(),v:v};j.res(v);},j.rej).then(function(){act--;pump();});})(q.shift());}}
function post(fn,args){
  var key=fn+JSON.stringify(args||[]);var c=cch[key];
  if(c&&Date.now()-c.t<30000)return Promise.resolve(c.v);
  if(inf[key])return inf[key];
  var p=new Promise(function(res,rej){q.push({key:key,fn:fn,args:args,res:res,rej:rej});pump();});
  inf[key]=p;var d=function(){delete inf[key];};p.then(d,d);return p;
}
function raw(fn,args){
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({k:K(),fn:fn,args:args||[]})}).then(function(r){return r.json();});
}
function mk(ok,fail){
  return new Proxy({},{get:function(t,name){
    if(name==="withSuccessHandler")return function(f){return mk(f,fail);};
    if(name==="withFailureHandler")return function(f){return mk(ok,f);};
    if(name==="withUserObject")return function(){return mk(ok,fail);};
    return function(){
      var args=[].slice.call(arguments);
      post(name,args).then(function(j){
        if(j&&j.ok){ if(ok)ok(j.result); }
        else { if(fail)fail(new Error((j&&j.error)||"error")); }
      }).catch(function(e){ if(fail)fail(e); });
    };
  }});
}
window.google={script:{run:mk(null,null),host:{close:function(){},setHeight:function(){}}}};
function addHead(){
  var h=document.head;
  function L(rel,href){var l=document.createElement("link");l.rel=rel;l.href=href;h.appendChild(l);}
  function M(n,c){var m=document.createElement("meta");m.name=n;m.content=c;h.appendChild(m);}
  L("manifest","manifest.json");L("apple-touch-icon","apple-touch-icon.png");
  M("apple-mobile-web-app-capable","yes");M("mobile-web-app-capable","yes");
  M("apple-mobile-web-app-title","Judo Academy");M("apple-mobile-web-app-status-bar-style","black");M("theme-color","#000000");
}
function render(html){
  document.open();document.write(html);document.close();
  try{addHead();}catch(e){}
  setTimeout(function(){
    var b=document.getElementById("logoutBtn");
    if(b){b.onclick=function(){LS.removeItem("ljfk");LS.removeItem("ljfpage");location.reload();};}
  },300);
}
var msg=document.getElementById("msg"),login=document.getElementById("login");
function showLogin(t){login.style.display="flex";msg.textContent=t||"";}
function load(){
  var cached=null;try{cached=LS.getItem("ljfpage");}catch(e){}
  if(cached){ render(cached); }
  else { msg.textContent="ກຳລັງໂຫຼດ... (ຄັ້ງທຳອິດອາດໃຊ້ເວລາຈັກໜ້ອຍ)"; }
  post("getPage",[]).then(function(j){
    if(j&&j.ok){
      try{LS.setItem("ljfpage",j.result);}catch(e){}
      if(!cached){ render(j.result); }
    } else if(!cached){
      LS.removeItem("ljfk");showLogin("ລະຫັດບໍ່ຖືກຕ້ອງ");
    }
  }).catch(function(e){
    if(!cached){ msg.textContent="ເຊື່ອມຕໍ່ບໍ່ໄດ້ ລອງໃໝ່"; var b=document.createElement("button");b.textContent="ລອງໃໝ່";b.onclick=function(){location.reload();};document.getElementById("shell").appendChild(b);}
  });
}
document.getElementById("go").onclick=function(){
  var v=document.getElementById("code").value.trim();
  if(!v)return;
  LS.setItem("ljfk",v);login.style.display="none";load();
};
document.getElementById("code").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("go").click();});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}
if(K()){load();}else{showLogin("");}
})();
</script>
</body></html>
